name: watch

on:
  schedule:
    # Every 5 minutes — GitHub's documented minimum. Scheduled runs are queued
    # best-effort and are commonly delayed 5-20 min under load, so treat this
    # as "within the hour", not "within 5 minutes". See README, Timing.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the e-mail instead of sending it"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m watcher.main \
            --config config.yaml \
            --state state/state.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): update watcher state [skip ci]"
          git push
